<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChildNutriAI — Upload Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-ring"></div>
      <div class="brand-name">ChildNutriAI</div>
    </div>
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="register.html">① Register Child</a>
    <a class="nav-link active" href="upload.html">② Upload Images</a>
    <a class="nav-link disabled" href="dashboard.html">③ Dashboard</a>
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link" href="contact.html">Contact</a>
    <div class="nav-tag">Milestone 2 build</div>
  </aside>

  <main class="main">
    <div class="page-eyebrow">Step 3 of 5</div>
    <h1 class="page-title">Upload child images</h1>
    <p class="page-sub">Add a clear face photo and a full-body photo, then upload both before continuing to AI processing.</p>

    <div class="card">
      <div class="upload-grid">
        <div>
          <div class="field" style="margin-bottom:10px;">
            <label>Face image</label>
          </div>
          <label class="upload-box" id="faceBox" for="faceInput" tabindex="0">
            <div class="upload-icon-ring">＋</div>
            <div class="upload-label-title">Choose file</div>
            <div class="upload-label-sub">Preview appears here</div>
            <input type="file" id="faceInput" accept="image/*" hidden>
          </label>
        </div>

        <div>
          <div class="field" style="margin-bottom:10px;">
            <label>Body image</label>
          </div>
          <label class="upload-box" id="bodyBox" for="bodyInput" tabindex="0">
            <div class="upload-icon-ring">＋</div>
            <div class="upload-label-title">Choose file</div>
            <div class="upload-label-sub">Preview appears here</div>
            <input type="file" id="bodyInput" accept="image/*" hidden>
          </label>
        </div>
      </div>

      <div class="upload-actions">
        <button type="button" class="btn-secondary" id="uploadBtn" disabled>Upload</button>
        <button type="button" class="btn-primary" id="nextBtn" disabled style="margin-top:0;">Next →</button>
        <span class="upload-status" id="uploadStatus">Both images uploaded successfully.</span>
      </div>
    </div>
  </main>
</div>

<script src="js/script.js"></script>
</body>
</html>
